name: Mobile — Android test build

# Manual-only (no push trigger) — building costs EAS build minutes on the
# Expo account's plan, and mobile/ is still in early development, so this
# should run when someone actually wants an installable build, not on
# every commit. Click "Run workflow" on this workflow in the GitHub
# Actions tab (works from the GitHub mobile app or a phone browser — no
# terminal needed) to trigger it.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (see mobile/eas.json)"
        type: choice
        options: [preview, development]
        default: preview

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Not `npm ci`: this dependency tree has real (not just stale-lockfile)
      # peer-dependency conflicts at the currently pinned Expo SDK 57
      # versions — react-dom resolves newer than the react-native-pinned
      # react version, and react-native-worklets' peer range doesn't quite
      # match what expo-modules-core wants. `npm ci` correctly refuses to
      # paper over that; `--legacy-peer-deps` is what was actually used and
      # validated (npx expo export) throughout development, so CI matches
      # that rather than a stricter install that was never the tested path.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Printed so it can be compared against the same line in the OTA update
      # workflow. If these two ever differ, updates will not reach this build
      # and the device will silently keep its embedded bundle.
      - name: Show resolved runtimeVersion
        run: |
          npx expo config --type public --json > /tmp/cfg.json
          node -e "
            const c = require('/tmp/cfg.json');
            const rv = c.runtimeVersion;
            console.log('runtimeVersion: ' + (rv && rv.policy ? rv.policy + ' -> ' + c.version : rv));
          "

      # First run only in practice: creates the EAS project the first time,
      # then just links to the existing one on every run after (matched by
      # app.json's slug under this account) — a robot token can't do this
      # interactively, which is what failed the previous run ("EAS project
      # not configured"). Requires app.json's "owner" to be set, since a
      # non-interactive token can't be prompted to pick an account either.
      - name: Link/create EAS project
        run: eas init --non-interactive --account myinvestorcircle.com
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Root-caused a real device crash (auth/invalid-api-key from Firebase,
      # confirmed via the on-device crash logger) to this: writing
      # mobile/.env on this runner (the previous approach here) never
      # actually reached the app, because `eas build` uploads the project
      # to EAS's remote build servers via `git archive`, which — correctly —
      # excludes gitignored files, .env included. The Firebase keys were
      # never in the built app at all, on any run, not just this one.
      # `eas env:set` registers these as EAS project environment variables
      # instead, which *are* included in what the remote build worker sees
      # (confirmed: EXPO_PUBLIC_API_ORIGIN, set the same way via eas.json's
      # profile `env`, does show up there) — the officially supported
      # mechanism for exactly this. `env:set` creates-or-updates, so this is
      # safe to run on every build. These are the same public, non-secret
      # Firebase web config values already embedded in the deployed web
      # app's bundle (see CLAUDE.md's EXPO_PUBLIC_/VITE_ convention) —
      # `plaintext` visibility is correct, not `secret`.
      - name: Sync Firebase + Google OAuth config to EAS environment variables
        run: |
          set -e
          for NAME in EXPO_PUBLIC_FIREBASE_API_KEY EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID EXPO_PUBLIC_FIREBASE_APP_ID; do
            eas env:set --non-interactive --scope project \
              --name "$NAME" --value "${!NAME}" --visibility plaintext \
              --environment production --environment preview --environment development
          done
          # Google sign-in OAuth client ids. OPTIONAL: unset ones are skipped,
          # and the app hides the Google button entirely when they're absent
          # (src/services/googleAuth.js), so a repo that hasn't configured
          # Google OAuth still builds and ships email/password sign-in exactly
          # as before. Client IDs are public by design (they appear in the
          # redirect URL of any OAuth flow); the client SECRET is not used by
          # this PKCE installed-app flow and must never be added here.
          for NAME in EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID; do
            if [ -n "${!NAME}" ]; then
              eas env:set --non-interactive --scope project \
                --name "$NAME" --value "${!NAME}" --visibility plaintext \
                --environment production --environment preview --environment development
            else
              echo "· $NAME not configured — Google sign-in will be hidden in this build."
            fi
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # Neither --verbose-logs nor --build-logger-level debug (both tried
      # in earlier fixes) actually streams the remote build worker's
      # phase-by-phase output into this job's log — confirmed twice now,
      # not assumed. `--json` instead gives a machine-readable result
      # (including the build ID) that the next step uses to fetch the
      # real per-phase logs directly via the EAS API, which does not
      # depend on any eas-cli logging flag behaving a particular way.
      # `|| true`: a failed build still writes valid JSON to stdout before
      # exiting non-zero — capture it and let the final step below be the
      # actual pass/fail gate, after logs have had a chance to print.
      # stderr is captured separately, not discarded: eas-cli writes the
      # machine-readable result to stdout (--json) but the human-readable
      # reason a build never started — plan/quota limits, credential
      # problems — only to stderr. A run that hit the Free-plan monthly
      # Android build cap previously surfaced as nothing but an empty
      # "Final build status:" and exit 1, which reads exactly like a broken
      # build and sent us hunting a code bug that did not exist.
      - name: Build on EAS (cloud)
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json \
            > eas-build-result.json 2> eas-build-stderr.txt || true
          echo "--- eas stdout (json result) ---"
          cat eas-build-result.json
          echo "--- eas stderr (messages) ---"
          cat eas-build-stderr.txt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # Two failed attempts at decoding the raw logFiles archive (assumed
      # gzip, then confirmed that guess wrong too — still garbled after
      # gzip -t/gunzip) is enough guessing at an undocumented log format.
      # `error { errorCode, message, docsUrl }` is part of eas-cli's own
      # standard Build GraphQL fragment (confirmed by reading its source:
      # graphql/types/Build.js) — a structured, reliable, documented field
      # already included in the same `eas build:view --json` response,
      # not a log archive that needs guessing at how to decode. Lead with
      # that. The raw logFiles fetch stays as a clearly-labeled best-effort
      # extra underneath, not the primary mechanism this depends on.
      - name: Fetch build error detail
        if: always()
        run: |
          BUILD_ID=$(jq -r 'if type=="array" then .[0].id else .id end' eas-build-result.json 2>/dev/null || echo "")
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Could not determine a build ID — raw eas build output was:"
            cat eas-build-result.json
            exit 0
          fi
          echo "Build ID: $BUILD_ID"
          eas build:view "$BUILD_ID" --json > build-view.json

          echo ""
          echo "================================================================"
          echo "BUILD ERROR (structured, from EAS)"
          echo "================================================================"
          jq '.error // "null (build did not report a structured error)"' build-view.json

          LOG_URLS=$(jq -r '.logFiles[]? // empty' build-view.json)
          if [ -z "$LOG_URLS" ]; then
            exit 0
          fi
          # Three prior guesses at this file's format (plain text, gzip via
          # gzip -t + gunzip) were all wrong — still garbled output each
          # time. Guessing a fourth time isn't good enough. This dumps hard
          # evidence (file type, size, hex of the first bytes) FIRST, tries
          # every compression `file` can plausibly identify, and only
          # falls back to strings/raw as a last resort — so either this
          # decodes correctly, or the diagnostic output makes the actual
          # format obvious instead of another blind guess.
          #
          # Also dropped the Authorization header for this fetch: these
          # logFiles URLs are Google Cloud Storage V4 *signed* URLs
          # (storage.googleapis.com?X-Goog-Signature=...) — the signature
          # in the query string is the auth; GCS signed URLs are meant to
          # be fetched anonymously, and sending an extra bearer token
          # neither helps nor is how they're designed to be used.
          i=0
          for url in $LOG_URLS; do
            i=$((i+1))
            echo ""
            echo "================================================================"
            echo "LOG $i: $url"
            echo "================================================================"
            curl -sSL "$url" -o "phase-$i.log" || { echo "(fetch failed)"; continue; }
            echo "--- file type & size ---"
            file "phase-$i.log" || true
            wc -c "phase-$i.log"
            echo "--- first 32 bytes (hex) ---"
            od -An -tx1 -N 32 "phase-$i.log"
            echo "--- decoded content ---"
            if gzip -t "phase-$i.log" 2>/dev/null; then
              echo "(detected: gzip)"
              gunzip -c "phase-$i.log" > "phase-$i.txt"
            elif command -v zstd >/dev/null && zstd -t "phase-$i.log" 2>/dev/null; then
              echo "(detected: zstd)"
              zstd -dc "phase-$i.log" > "phase-$i.txt"
            elif command -v brotli >/dev/null && brotli -t "phase-$i.log" 2>/dev/null; then
              echo "(detected: brotli)"
              brotli -dc "phase-$i.log" > "phase-$i.txt"
            else
              echo "(no known compression detected — treating as-is)"
              cp "phase-$i.log" "phase-$i.txt"
            fi
            jq -r '.msg? // empty' "phase-$i.txt" 2>/dev/null || strings "phase-$i.txt"
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # eas-cli's --json output reports status as "FINISHED" (uppercase) —
      # confirmed on an actual successful run whose job still failed here
      # because this comparison was case-sensitive against a lowercase
      # literal, wrongly treating a real success as a failure.
      - name: Check build actually succeeded
        if: always()
        run: |
          STATUS=$(jq -r 'if type=="array" then .[0].status else .status end' eas-build-result.json 2>/dev/null || echo "")
          echo "Final build status: ${STATUS:-(no build was created)}"

          # A build that never STARTED is a different problem from a build
          # that started and failed, and must not be reported the same way —
          # conflating the two cost a debugging cycle chasing a code bug that
          # did not exist. Surface the account-level reasons explicitly.
          if [ -z "$STATUS" ] || [ "$STATUS" = "null" ]; then
            echo ""
            echo "================================================================"
            if grep -qiE "used its .*builds from the Free plan|billing:subscribe|upgrade your plan" eas-build-stderr.txt 2>/dev/null; then
              echo "NO BUILD RAN — Expo plan build quota exhausted."
              echo "This is an account/billing limit, NOT a problem with the app code."
              echo "The quota resets automatically; re-run this workflow after that,"
              echo "or upgrade the Expo plan. Relevant eas-cli output:"
              grep -iE "Free plan|billing:subscribe|upgrade your plan|reset" eas-build-stderr.txt || true
            else
              echo "NO BUILD RAN — eas build exited before creating a build."
              echo "Full eas-cli stderr:"
              cat eas-build-stderr.txt 2>/dev/null || echo "(no stderr captured)"
            fi
            echo "================================================================"
            exit 1
          fi

          [ "$(echo "$STATUS" | tr '[:upper:]' '[:lower:]')" = "finished" ]
