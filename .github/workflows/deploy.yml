name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push to the gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        # Only PUBLIC values belong here. Anything named VITE_* is compiled
        # into the JavaScript every visitor downloads, so a database URL or an
        # API secret passed in at this step is published, not configured.
        # Server-only credentials live in the Vercel dashboard, where the
        # api/ functions read them (see CLAUDE.md, "Environment variables").
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_PRICE_API_URL:                ${{ secrets.VITE_PRICE_API_URL }}
          VITE_CAS_API_URL:                  ${{ secrets.VITE_CAS_API_URL }}
          VITE_VAPID_PUBLIC_KEY:             ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID:      ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_ANDROID_STORE_URL:            ${{ vars.VITE_ANDROID_STORE_URL }}
          # Android App Links verification. Without this, a link shared from
          # the mobile app opens the BROWSER rather than the app, even for
          # people who have it installed (Android 12+ refuses to hand the link
          # over unless /.well-known/assetlinks.json names the signing
          # certificate). Not a secret — a certificate fingerprint is public by
          # design and is served to the world at that URL — so it is a repo
          # VARIABLE, not a secret. Unset: the file is simply not published.
          # See scripts/write-assetlinks.mjs for where to find the value.
          ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_SHA256_CERT_FINGERPRINTS }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
