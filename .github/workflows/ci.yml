name: CI

# Runs automatically on every pull request — no manual trigger needed.
# Previously the only workflow in this repo (deploy.yml) ran solely on
# push to main, meaning nothing gated a branch before it merged; a broken
# build or a runtime crash only surfaced after landing on main, which
# GitHub Pages auto-deploys as production. This workflow closes that gap.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npm test

      # The email endpoint's send policy is Python. Deliberately written with
      # no dependencies so it runs here without installing resend or the
      # Firebase SDK — it decides who may email whom, so it should not be the
      # one piece of security logic nothing checks.
      - name: Email policy tests (Python)
        run: python3 api/_lib/email_policy_test.py

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Serve build
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173 > /dev/null || (echo "Preview server never came up" && exit 1)

      - name: Smoke test (local preview build)
        run: npm run smoke
        env:
          SMOKE_BASE_URL: http://localhost:4173

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7
