name: Mobile — Publish OTA update

# Ships a JavaScript-only change to phones that already have the app,
# WITHOUT consuming an EAS build. This is the cheap path: a build is only
# needed when native code changes (a new native dependency, a permission, an
# app.json plugin). Everything else — a screen fix, a layout change, wording,
# most crashes — goes out through here.
#
# Trigger it the same way as the build workflow: "Run workflow" in the
# Actions tab, which works from a phone browser or the GitHub mobile app.
#
# The installed app only accepts an update whose runtimeVersion matches its
# own. app.json sets `runtimeVersion: { policy: "fingerprint" }`, which
# derives that value from the native dependency set — so if this update DOES
# need native changes, phones simply never receive it rather than downloading
# something that would crash on launch. The job prints the fingerprint so a
# mismatch is visible here rather than mysterious on the device.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which installed builds to update (must match the build's channel)"
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: "What changed (shown in the EAS dashboard)"
        type: string
        default: "JS update"

jobs:
  publish-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    # EXPO_PUBLIC_* vars are inlined into the JS bundle at BUNDLE time, and
    # unlike `eas build` (which runs on EAS's remote servers and picks up
    # project-level `eas env:set` values there), `eas update` bundles
    # LOCALLY on this runner — the "Verify the bundle builds" and "Publish
    # update" steps below both invoke Metro directly, so they only see
    # process.env as set in THIS job, not whatever's registered on EAS.
    # Without these, mobile/src/config/firebase.js's apiKey etc. resolve to
    # undefined, and every OTA-published bundle crashes on launch with
    # Firebase: Error (auth/invalid-api-key) — confirmed via the on-device
    # crash logger (plugins/withCrashLogger.js) after every OTA update this
    # workflow published crashed identically. Same secrets the build
    # workflow uses (mobile-build-android.yml), just supplied directly here
    # instead of round-tripping through `eas env:set` for a step that never
    # reads it back from there.
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Same install as the build workflow, and for the same reason: this
      # dependency tree has real peer-dependency conflicts at the pinned
      # Expo SDK 57 versions, and --legacy-peer-deps is the path that was
      # actually validated. Matching the build workflow matters more than
      # usual here, since an update is bundled from these same modules.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # An update whose bundle does not build is worse than no update: it
      # would be published and then fail on real phones. Bundle first.
      - name: Verify the bundle builds
        run: npx expo export --platform android

      # An update whose runtimeVersion does not match the installed app is
      # silently never delivered — the device just keeps running its embedded
      # bundle and nothing anywhere reports a problem. That happened once and
      # cost a whole debugging cycle, so the value is printed on both sides
      # (the build workflow prints the same line) and they must agree.
      - name: Show resolved runtimeVersion
        run: |
          npx expo config --type public --json > /tmp/cfg.json
          node -e "
            const c = require('/tmp/cfg.json');
            const rv = c.runtimeVersion;
            if (rv && typeof rv === 'object' && rv.policy) {
              console.error('runtimeVersion is still a POLICY (' + rv.policy + '), not a resolved value.');
              console.error('If that policy is \'fingerprint\', delivery depends on a hash computed');
              console.error('per environment and updates will usually NOT reach installed apps.');
              if (rv.policy === 'fingerprint') process.exit(1);
              console.log('runtimeVersion policy: ' + rv.policy + ' -> ' + c.version);
            } else {
              console.log('runtimeVersion: ' + rv);
            }
          "

      - name: Publish update
        run: |
          eas update --branch "${{ inputs.channel }}" \
            --message "${{ inputs.message }}" \
            --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: What happens next
        if: success()
        run: |
          echo "Published to branch/channel: ${{ inputs.channel }}"
          echo "Installed apps pick this up on their NEXT launch (the app does not"
          echo "block startup waiting for it — EXPO_UPDATES_LAUNCH_WAIT_MS is 0)."
          echo "To pull it immediately on a device: Profile > Diagnostics >"
          echo "Check for update."
